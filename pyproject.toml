[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "Diabetes_prediction"
version = "0.0.1"
description = "Should you get screened for Diabetes? A deep dive into variables connected with diabetes"
authors = [
  { name = "Louis BARTHELEMY" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["Diabetes_prediction"]
include = ["pyproject.toml", "Diabetes_prediction/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["Diabetes_prediction"]
force-sort-within-sections = true

